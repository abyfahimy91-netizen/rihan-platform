<div class="content-block gallery-block {{ css_class }}">
    {% if title %}<h3 class="block-title">{{ title }}</h3>{% endif %}
    <div class="block-gallery">
        {% for img in extra_data.images %}
        <figure class="gallery-item">
            <img src="{{ img.url }}" alt="{{ img.alt|default:'' }}">
            {% if img.caption %}<figcaption>{{ img.caption }}</figcaption>{% endif %}
        </figure>
        {% endfor %}
    </div>
</div>
