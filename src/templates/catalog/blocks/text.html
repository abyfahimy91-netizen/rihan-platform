<div class="content-block text-block {{ css_class }}" {% if background_color %}style="background-color: {{ background_color }};"{% endif %}>
    {% if title %}<h3 class="block-title">{{ title }}</h3>{% endif %}
    {% if subtitle %}<p class="block-subtitle">{{ subtitle }}</p>{% endif %}
    <div class="block-content">
        {{ content|safe }}
    </div>
</div>
