<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ریهان - فروشگاه آنلاین اعتمادمحور{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}ریهان - انتخاب مطمئن، هر محصولی که باشد{% endblock %}">
    
    <!-- Open Graph (D-079 - Social Sharing) -->
    <meta property="og:title" content="{% block og_title %}ریهان{% endblock %}">
    <meta property="og:description" content="{% block og_description %}انتخاب مطمئن، هر محصولی که باشد{% endblock %}">
    <meta property="og:type" content="website">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            line-height: 1.8;
            color: #2d2d2d;
            background-color: #fafafa;
            direction: rtl;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header */
        header {
            background: #fff;
            border-bottom: 1px solid #e8e8e8;
            padding: 20px 0;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            text-decoration: none;
        }
        
        /* Main Content */
        main {
            padding: 40px 0;
            min-height: 60vh;
        }
        
        /* Footer */
        footer {
            background: #1a1a1a;
            color: #fff;
            padding: 30px 0;
            margin-top: 60px;
        }
        
        .footer-content {
            text-align: center;
            color: #999;
        }
        
        /* Trust Badges */
        .trust-badges {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        
        .trust-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #f0f7f0;
            border-radius: 8px;
            font-size: 14px;
            color: #2d5a2d;
        }
        
        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #1a1a1a;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #333;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">ریهان</a>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>ریهان - انتخاب مطمئن، هر محصولی که باشد</p>
            </div>
        </div>
    </footer>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
