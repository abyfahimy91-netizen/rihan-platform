<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پنل تامین‌کننده | ریهان{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Tahoma, Arial, sans-serif; background: #f4f6f4; color: #222; line-height: 1.9; }
        .topbar { background: #0D3B2E; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .topbar a { color: #EAD9A7; text-decoration: none; font-size: 14px; padding: 4px 8px; border-radius: 6px; }
        .topbar a:hover { background: rgba(255,255,255,.08); }
        .topbar .brand { font-weight: bold; font-size: 16px; color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card > h3 { font-size: 16px; color: #0D3B2E; }
        .btn { display: inline-block; padding: 10px 18px; border-radius: 8px; text-decoration: none; cursor: pointer; border: none; font-family: inherit; font-size: 14px; font-weight: bold; }
        .btn-primary { background: #0D3B2E; color: #fff; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-gold { background: #C9A961; color: #12362a; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 12px; text-align: right; border-bottom: 1px solid #e5e5e5; font-size: 14px; }
        .table th { background: #FAF7F0; font-size: 12.5px; color: #665; }
        .badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; color: #fff; display: inline-block; white-space: nowrap; }
        .b-new { background: #c8a24b; } .b-shipped { background: #28a745; } .b-delivered { background: #0D3B2E; }
        .alert { padding: 12px 15px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .alert-info { background: #d1ecf1; color: #0c5460; }
        .alert-warning { background: #fff3cd; color: #856404; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; font-size: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #444; font-weight: bold; }
        .mb-3 { margin-bottom: 15px; } .mt-3 { margin-top: 15px; } .mt-4 { margin-top: 20px; } .mb-4 { margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; }
        .stat { background: #FAF7F0; border-radius: 10px; padding: 16px; text-align: center; text-decoration: none; color: #222; display: block; border: 2px solid transparent; transition: .15s; }
        .stat:hover { border-color: #C9A961; transform: translateY(-2px); }
        .stat b { display: block; font-size: 26px; color: #0D3B2E; }
        .addr { background: #FAF7F0; padding: 12px; border-radius: 8px; line-height: 2; font-size: 14px; }
        .copy-btn { background: #EAD9A7; color: #0D3B2E; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-family: inherit; font-size: 13px; }
        .copy-btn:hover { background: #dcbf7f; }
        .muted { color: #888; font-size: 13px; }
        code.latin { direction: ltr; unicode-bidi: embed; font-family: monospace; font-size: 15px; background:#f0f0f0; padding:2px 8px; border-radius:6px; }
        /* ── D-111: سفر کاربر راهنمامحور ── */
        .steps { display: flex; gap: 0; margin: 8px 0 4px; flex-wrap: wrap; }
        .step { flex: 1; min-width: 150px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 10px; position: relative; }
        .step-num { width: 30px; height: 30px; border-radius: 50%; background: #0D3B2E; color: #EAD9A7; font-weight: bold;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
        .step.is-done .step-num { background: #28a745; color: #fff; }
        .step.is-active .step-num { background: #C9A961; color: #12362a; box-shadow: 0 0 0 4px rgba(201,169,97,.25); }
        .step-t { font-size: 13.5px; font-weight: bold; color: #333; }
        .step-d { font-size: 12px; color: #777; }
        .guide { background: #F6FBF4; border: 1.5px dashed #9fc4a8; border-radius: 12px; padding: 14px 18px; font-size: 13.5px; color: #2e5137; margin-bottom: 16px; }
        .guide b { color: #0D3B2E; }
        .hint-box { background: #FBF6E8; border-right: 4px solid #C9A961; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #6e5a24; margin-top: 8px; line-height: 2; }
        .hidden { display: none; }
        @media (max-width: 640px) {
            .container { padding: 12px; }
            .step { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <span class="brand">🌿 پنل تامین‌کننده ریّان</span>
        <a href="{% url 'supplier_panel:dashboard' %}">داشبورد</a>
        <a href="{% url 'supplier_panel:shipment_list' %}">مرسوله‌های من</a>
        <span style="margin-inline-start:auto;font-size:13px;color:#cfe3d8;">
            {% if supplier %}{{ supplier.title }}{% endif %}
        </span>
    </div>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script>
        // کپی عمومی: هر دکمه‌ای با data-copy-target متن عنصر مقصد را کپی می‌کند
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-copy-target]');
            if (!btn) return;
            var el = document.querySelector(btn.getAttribute('data-copy-target'));
            if (!el) return;
            var txt = (el.getAttribute('data-copy-value') || el.textContent).trim();
            function done() { var old = btn.textContent; btn.textContent = '✅ کپی شد';
                setTimeout(function(){ btn.textContent = old; }, 1800); }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(done);
            } else {
                var r = document.createRange(); r.selectNodeContents(el);
                var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
                try { document.execCommand('copy'); done(); } catch (err) {}
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
